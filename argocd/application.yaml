apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: ann-mnist
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pkai21/ann-mnist-devops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: ann-mnist

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true