
name: Configure GHCR Pull Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, khai-server]

    steps:
      - name: Create or update GHCR pull secret
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail

          kubectl create namespace ann-mnist \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace ann-mnist \
            --docker-server=ghcr.io \
            --docker-username=pkai21 \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "GHCR pull secret configured."