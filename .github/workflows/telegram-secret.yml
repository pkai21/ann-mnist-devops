name: Configure Telegram Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, khai-server]

    steps:
      - name: Create or update Telegram bot secret
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" ]]; then
            echo "Error: TELEGRAM_BOT_TOKEN is not configured."
            exit 1
          fi

          for ns in monitoring ann-mnist; do
            kubectl get namespace "$ns" >/dev/null 

            kubectl create secret generic telegram-bot-secret \
              --namespace "$ns" \
              --from-literal=bot-token="$TELEGRAM_BOT_TOKEN" \
              --dry-run=client -o yaml \
              | kubectl apply -f -
          done

          echo "Telegram bot secret configured in both namespaces."
