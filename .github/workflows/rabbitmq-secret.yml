name: Configure RabbitMQ Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, khai-server]

    steps:
      - name: Create or update RabbitMQ secret
        env:
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RABBITMQ_PASSWORD:-}" ]]; then
            echo "Error: RABBITMQ_PASSWORD is not configured."
            exit 1
          fi

          # Tạo namespace nếu chưa có (giống workflow ghcr-pull-secret)
          kubectl create namespace ann-mnist \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic rabbitmq-secret \
            --namespace ann-mnist \
            --from-literal=username=annmnist \
            --from-literal=password="$RABBITMQ_PASSWORD" \
            --dry-run=client -o yaml \
            | kubectl apply -f -

          echo "RabbitMQ secret configured."