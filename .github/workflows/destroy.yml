name: Destroy Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    runs-on: [self-hosted, khai-server]
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_VAR_kubernetes_host: ${{ secrets.KUBERNETES_HOST }}
      TF_VAR_kubernetes_ca_certificate: ${{ secrets.KUBERNETES_CA_CERTIFICATE }}
      TF_VAR_kubernetes_token: ${{ secrets.KUBERNETES_TOKEN }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      # Gỡ monitoring, argocd, và 2 namespace tương ứng
      - run: terraform destroy -auto-approve -input=false