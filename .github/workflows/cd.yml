name: CD

on:
repository_dispatch:
types: [image-updated]

permissions:
contents: write

jobs:
deploy:
name: Update image tag with GitOps
runs-on: ubuntu-latest

environment:
  name: production

concurrency:
  group: production-deployment
  cancel-in-progress: false

steps:
  - name: Checkout DEVOPS repo
    uses: actions/checkout@v6
    with:
      ref: main

  - name: Validate image payload
    env:
      IMAGE: ${{ github.event.client_payload.image }}
      TAG: ${{ github.event.client_payload.tag }}
    run: |
      set -euo pipefail

      test "$IMAGE" = "ghcr.io/pkai21/ann-mnist-dev"
      [[ "$TAG" =~ ^sha-[0-9a-f]{40}$ ]]

  - name: Update image tag in Git
    env:
      IMAGE: ${{ github.event.client_payload.image }}
      TAG: ${{ github.event.client_payload.tag }}
    run: |
      set -euo pipefail

      test -f k8s/namespace.yaml
      test -f k8s/service.yaml
      test -f k8s/deployment.yaml

      grep -Fq "image: ${IMAGE}:" k8s/deployment.yaml

      sed -i -E \
        "s|image: ${IMAGE}:[^[:space:]]+|image: ${IMAGE}:${TAG}|" \
        k8s/deployment.yaml

      grep -Fq "image: ${IMAGE}:${TAG}" k8s/deployment.yaml

      if git diff --quiet -- k8s/deployment.yaml; then
        echo "Image tag không đổi"
        exit 0
      fi

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add k8s/deployment.yaml
      git commit -m "cd: deploy ${TAG} [skip ci]"
      git push origin HEAD:main
