name: CD

on:
  repository_dispatch:
    types: [image-updated]

jobs:
  deploy:
    name: Deploy with GitOps
    # Chỉ deploy khi CI xanh trên push vào main (không deploy PR)
    environment:
      name: production   # cổng duyệt tay (Settings → Environments → Required reviewers)

    runs-on: ubuntu-latest

    permissions:
      contents: write    # cần để commit tag image mới

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout DEVOPS repo
        uses: actions/checkout@v6

      - name: Update image tag in Git
        env:
          IMAGE: ${{ github.event.client_payload.image }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          echo "Image: ${IMAGE}"
          echo "Tag: ${TAG}"

          sed -i -E "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" \
            k8s/deployment.yaml

          test -f k8s/namespace.yaml
          test -f k8s/service.yaml
          test -f k8s/deployment.yaml

          grep -q "${TAG}" k8s/deployment.yaml;

          if git diff --quiet k8s/deployment.yaml; then
            echo "Tag không đổi"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add k8s/deployment.yaml
          git commit -m "cd: deploy ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main