apiVersion: apps/v1

kind: Deployment

metadata:
  name: ann-mnist-api
  namespace: ann-mnist

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ann-mnist-api

  template:
    metadata:
      labels:
        app: ann-mnist-api

    spec:
      containers:
        - name: ann-mnist-api

          image: ghcr.io/pkai21/ann-mnist-dev:sha-ed903d946766171a2beb529387d1d405fa39bfdf

          imagePullPolicy: Always

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10