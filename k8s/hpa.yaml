
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: ann-mnist-api
  namespace: ann-mnist

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ann-mnist-api

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70