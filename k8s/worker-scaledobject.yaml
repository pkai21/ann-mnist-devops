apiVersion: keda.sh/v1alpha1
kind: ScaledObject

metadata:
  name: ann-mnist-worker
  namespace: ann-mnist

spec:
  scaleTargetRef:
    # Deployment cần điều khiển (cùng namespace với ScaledObject)
    name: ann-mnist-worker

  minReplicaCount: 2
  maxReplicaCount: 6

  # Hỏi Prometheus lỗi 3 lần liên tiếp thì giữ cứng 4 pod
  # thay vì "mù" và giữ nguyên số pod hiện tại
  fallback:
    failureThreshold: 3
    replicas: 4

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # 0 = scale lên ngay, không chờ ổn định
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 4
              periodSeconds: 15
        scaleDown:
          # Giảm thật chậm: dự đoán xu hướng có thể báo động giả,
          # và pod vừa tắt thì phải khởi động lại nếu tải quay về
          stabilizationWindowSeconds: 300
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60

  triggers:
    # Trigger 1: độ sâu queue HIỆN TẠI, lưới an toàn cuối cùng.
    # 5000 = QUEUE_MAX_LENGTH (30.000) / maxReplicaCount (6):
    # queue thật sự đầy thì ra đúng 6 pod.
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
        query: sum(rabbitmq_detailed_queue_messages_ready{queue="predict_jobs", namespace="ann-mnist"})
        threshold: "5000"
        ignoreNullValues: "true"

    # Trigger 2: độ sâu queue DỰ ĐOÁN sau 180 giây theo xu hướng 2 phút gần nhất.
    # Dự đoán chạm 30.000 (đầy) thì ra đúng 6 pod, ngay từ lúc đó chứ không đợi đầy thật.
    # clamp_min(..., 0): queue đang giảm có thể cho dự đoán âm, ép về 0.
    # CẢNH BÁO: [2m] cần ít nhất 4 mẫu, ServiceMonitor đang lấy mẫu mỗi 15s (8 mẫu).
    # Nếu đổi interval của ServiceMonitor RabbitMQ thì phải đổi lại [2m].
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
        query: clamp_min(sum(predict_linear(rabbitmq_detailed_queue_messages_ready{queue="predict_jobs", namespace="ann-mnist"}[2m], 180)), 0)
        threshold: "5000"
        ignoreNullValues: "true"