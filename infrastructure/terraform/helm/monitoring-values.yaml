grafana:
  enabled: true

  service:
    type: NodePort
    nodePort: 30300

prometheus:
  enabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    # Tắt việc Operator tự chèn matcher namespace="monitoring" vào route.
    # Nếu không, alert của namespace ann-mnist sẽ không bao giờ khớp route.
    alertmanagerConfigMatcherStrategy:
      type: None

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true